[package]
name = "shin-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Shin: a small, fast, cross-platform 3D engine that humans, scripts, and AI agents drive through the same API."
keywords = ["gamedev", "engine", "3d", "wgpu", "mcp"]
categories = ["game-engines", "graphics", "rendering"]
# Sources, the agent skills, and the assets `project::create` embeds.
# Tests, goldens, and examples stay in the repository.
include = [
    "src/**",
    "skills/**",
    "assets/test/cube.gltf",
    "assets/test/cube.bin",
    "assets/sounds/blip.wav",
]

[lib]
name = "shin"
path = "src/lib.rs"

[dependencies]
winit = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
glam = { workspace = true }
hecs = { workspace = true }
gltf = { workspace = true }
image = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
ron = { workspace = true }
rhai = { workspace = true }
kira = { workspace = true }
rapier3d = { workspace = true }
gilrs = { workspace = true }
postcard = { workspace = true }

