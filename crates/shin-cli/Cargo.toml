[package]
name = "shin-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "The `shin` command-line tool: create and manage Shin game projects."
keywords = ["gamedev", "engine", "cli", "scaffolding"]
categories = ["game-engines", "command-line-utilities"]
include = ["src/**"]

[[bin]]
name = "shin"
path = "src/main.rs"
# The binary shares its name with the engine library `shin`; documenting
# both would collide in `target/doc/shin`. The CLI is documented by `--help`.
doc = false

[dependencies]
shin-engine = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
env_logger = { workspace = true }
# Reads tool JSON schemas for `shin docs tools`; also used by the tests.
serde_json = { workspace = true }
