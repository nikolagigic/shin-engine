[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nikolagigic/shin-engine"
homepage = "https://nikolagigic.github.io/shin-engine/"
readme = "README.md"

# Every dependency is pinned here. Crates use `{ workspace = true }`.
# Do NOT add dependencies in a crate Cargo.toml without adding them here first.
[workspace.dependencies]
# The workspace's own crates: the path builds them here, the version is
# what `cargo publish` writes into the published manifests. Bump both
# with the workspace version.
shin-engine = { path = "crates/shin-engine", version = "0.1.0" }
shin-mcp = { path = "crates/shin-mcp", version = "0.1.0" }
# Windowing & input
winit = "0.30"
# GPU
wgpu = "30.0"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
# Math
glam = { version = "0.34", features = ["bytemuck"] }
# ECS
hecs = "0.11"
# Assets
gltf = { version = "1.4", features = ["utils"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Utilities
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2.0"
# Tool registry (engine-native; MCP is one transport over it)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
# MCP server crate only (never in the engine lib)
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
base64 = "0.23"

# Milestone 2 (not yet used; pinned so adding them later is conflict-free)
rhai = "1.26"
rapier3d = "0.36"
egui = "0.36"
egui-wgpu = { version = "0.36", features = ["winit"] }
egui-winit = "0.36"
egui_dock = "0.21"
ron = "0.12"
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }

# Milestone 3 (ADR 0010): physics, audio, gamepads, viewport gizmos
kira = { version = "0.12", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "pcm"] }
gilrs = "0.11"
transform-gizmo-egui = "0.11"

# Milestone 4 (ADR 0011): multiplayer. The snapshot and message codec.
postcard = { version = "1", features = ["use-std"] }

[profile.dev]
opt-level = 1            # keep debug builds usable for a real-time loop

[profile.dev.package."*"]
opt-level = 3            # deps (wgpu, image) always optimized

[profile.release]
debug = 1                # keep symbols for profiling
