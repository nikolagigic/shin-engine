# GE-010: continuous integration. Each job runs one item of the definition of
# done in CLAUDE.md, using the same cargo aliases developers run locally
# (`check-all` and `test-all` live in `.cargo/config.toml`).
#
# The Rust toolchain comes from `rust-toolchain.toml`; `rustup toolchain
# install` with no arguments installs exactly that version and its components.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GE-037: the release workflow runs this whole file as its first job.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # CI builds from scratch; incremental artefacts only bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers (cpal, for the audio backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-lint-
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo check-all
        run: cargo check-all

  test-linux:
    name: test (Linux, lavapipe)
    runs-on: ubuntu-latest
    env:
      # No GPU on the runner: Mesa's lavapipe is a software Vulkan driver.
      # `GpuContext` reads this through `InstanceDescriptor::*_from_env`, so
      # wgpu only considers Vulkan and the golden tests run (not skipped).
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers (cpal, for the audio backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Install Mesa lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
      - name: Show Vulkan devices
        run: vulkaninfo --summary
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - name: cargo test-all
        run: cargo test-all

  test-macos:
    name: test (macOS, Metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - name: cargo test-all
        run: cargo test-all

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers (cpal, for the audio backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-docs-
      - name: cargo doc --no-deps
        run: cargo doc --no-deps

  # GE-037: every published crate packages and builds from its package
  # alone, in dependency order. One `cargo publish` with several `-p`
  # resolves the workspace crates against each other, so this works before
  # any of them is on crates.io.
  publish-dry-run:
    name: publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers (cpal, for the audio backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-publish-
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked -p shin-engine -p shin-mcp -p shin-cli -p shin-editor

  # GE-029: the user guide builds and its generated tools reference is up
  # to date. mdBook comes from the prebuilt release tarball, not
  # `cargo install`, so the job takes seconds.
  guide:
    name: guide (mdBook + tools reference)
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: v0.5.4
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers (cpal, for the audio backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Install mdBook from the release tarball
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: mdbook build guide
        run: mdbook build guide
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-guide-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-guide-
      - name: cargo test -p shin-cli docs
        run: cargo test -p shin-cli docs
      - name: Upload the book for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: guide/book

  # Publishes guide/book to GitHub Pages on every push to main. Only in the
  # upstream repository (forks have no Pages site for it); enable Pages
  # once under Settings > Pages > Source: GitHub Actions.
  deploy-guide:
    name: deploy guide (GitHub Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'nikolagigic/shin-engine'
    needs: guide
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
