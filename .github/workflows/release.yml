# GE-037: release on a version tag. Push `v<version>` (matching the
# workspace version in Cargo.toml) after the release commit is on main:
#
#   1. ci        the full definition of done (ci.yml, reused as is)
#   2. binaries  `shin` + `shin-editor` for macOS arm64 and Linux x86_64
#   3. publish   the crates to crates.io in dependency order
#   4. release   a GitHub Release with the CHANGELOG.md section and binaries
#
# Binaries are built before anything is published, so a failed build
# leaves nothing half released. Publishing needs the repository secret
# CARGO_REGISTRY_TOKEN (a crates.io API token with the publish-new and
# publish-update scopes).
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # ci.yml's deploy-guide job asks for these; it is skipped for tags, but
    # a called workflow may not ask for more than its caller grants.
    permissions:
      contents: read
      pages: write
      id-token: write

  binaries:
    name: binaries (${{ matrix.target }})
    needs: ci
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers (cpal, for the audio backend)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }} -p shin-cli -p shin-editor
      - name: Package
        run: |
          name="shin-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/shin target/${{ matrix.target }}/release/shin-editor "$name/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: shin-*.tar.gz

  publish:
    name: publish to crates.io
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers (cpal, for the audio backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: The tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "shin-engine") | .version')
          test "v$version" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME does not match the workspace version $version"; exit 1; }
      # Cargo publishes the -p packages in dependency order (shin-engine
      # first; shin-mcp, shin-cli, and shin-editor depend only on it) and
      # waits for each to reach the index before publishing the crates
      # that depend on it.
      - name: cargo publish
        run: cargo publish --locked -p shin-engine -p shin-mcp -p shin-cli -p shin-editor
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # From `## [<version>]` up to the next `## [`, without the link
          # definitions at the end of the file.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" --title "Shin $GITHUB_REF_NAME" --notes-file notes.md dist/*
        env:
          GH_TOKEN: ${{ github.token }}
